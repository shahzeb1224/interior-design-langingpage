<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>contact sheet</title>
    <style>
      body { margin: 0; background: #fff; font: 11px/1.3 monospace; }
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 6px; }
      figure { margin: 0; }
      img { width: 100%; height: 190px; object-fit: cover; display: block; background: #eee; }
      figcaption { font-size: 11px; padding: 2px 0; }
    </style>
  </head>
  <body>
    <div class="grid" id="g"></div>
    <script>
      const ids = (new URLSearchParams(location.search).get('ids') || '').split(',').filter(Boolean);
      const g = document.getElementById('g');
      ids.forEach((id, i) => {
        const f = document.createElement('figure');
        f.innerHTML = `<img src="https://images.unsplash.com/photo-${id}?auto=format&fit=crop&w=420&q=70" loading="eager"><figcaption>${i + 1}. ${id}</figcaption>`;
        g.appendChild(f);
      });
    </script>
  </body>
</html>
